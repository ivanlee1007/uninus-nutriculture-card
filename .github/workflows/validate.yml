# Read-only validation; no secrets, deployment or untrusted event interpolation.
name: Native card validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - name: Export installed Chromium executable
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              executable = Path(os.environ.get('CHROMIUM_EXECUTABLE') or p.chromium.executable_path)
              assert executable.is_file(), executable
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
                  env.write(f'CHROMIUM_EXECUTABLE={executable}\n')
          PY
      - run: npm test
      - name: Verify all activated canonical Card suites
        run: |
          python - <<'PY'
          import json,pathlib,os
          files=list(pathlib.Path(os.environ.get('CARD_GATE_ROOT','test-results/gate')).glob('*/result.json'))
          assert len(files)==1
          results={r['name']:r for r in json.loads(files[0].read_text())['results']}
          for name,count in [('unit',14),('browser',46),('p4a-browser',16),('p4b-browser',21),('p4c-browser',16),('p5b-history-browser',16),('p5c-runtime-browser',31)]:
              row=results[name]
              assert row['returncode']==0 and row['expected_cases']==row['executed_cases']==count
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-native-evidence
          path: test-results/gate
